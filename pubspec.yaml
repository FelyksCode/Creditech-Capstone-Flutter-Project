name: creditech_capstone_project
description: "A Flutter project for Capstone Submission."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  google_sign_in: ^6.2.1
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  image_picker: ^1.0.7
  http: ^1.2.0
  permission_handler: ^11.3.0
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  envied_generator: ^1.3.0
  flutter_dotenv: ^5.1.0
  crypto: ^3.0.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/img.png
    - assets/images/img_1.png
    - assets/images/img_2.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#B1B1B1"
  adaptive_icon_foreground: "assets/images/app_icon.png"